spring:
  application:
    name: marketplace-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:repairshop}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8087}

app:
  security:
    # One-time TPIN (X-TPIN-Authorization) on protected routes / attendance (migration 123).
    tpin-enforced: ${TPIN_ENFORCED:false}
    tpin-routes: ${TPIN_ROUTES:POST /shop/buy-orders/*/*=BUY_ORDER, POST /staff/buy-orders/*/pickup=BUY_ORDER, POST /staff/buy-orders/*/deliver=BUY_ORDER}
    # Action types enforced before the global switch (staged rollout), e.g. BUY_ORDER.
    tpin-enforced-actions: ${TPIN_ENFORCED_ACTIONS:}
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-for-repair-shop-saas-jwt-signing}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
